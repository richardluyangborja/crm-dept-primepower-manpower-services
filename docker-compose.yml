services:
  db:
    image: postgres:16-alpine
    container_name: crm_primepower_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_primepower
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_secret # override via .env in real setup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_primepower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
