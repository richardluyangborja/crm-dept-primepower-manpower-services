name: ci

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_primepower
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U crm -d crm_primepower"
          --health-interval=5s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, pdo_pgsql, sqlite3, pdo_sqlite, mbstring, bcmath
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && php artisan jwt:secret --no-interaction
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: crm_primepower
          DB_USERNAME: crm
          DB_PASSWORD: crm_secret
      - run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: crm_primepower
          DB_USERNAME: crm
          DB_PASSWORD: crm_secret
      - name: Run php artisan test
        run: |
          set +e
          php artisan test --no-ansi > /tmp/test.log 2>&1
          code=$?
          grep -v '^$' /tmp/test.log | sed 's/::/;;/g' | tail -30 | while IFS= read -r line; do echo "::error::$line"; done
          exit $code
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: crm_primepower
          DB_USERNAME: crm
          DB_PASSWORD: crm_secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
